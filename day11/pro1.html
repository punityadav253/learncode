<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function cube(number) {
            return number * number * number;
        }
        document.write(cube(3));
        document.write("<br>");
        document.write(cube(12));
    </script>
</body>
