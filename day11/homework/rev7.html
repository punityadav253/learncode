<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let digit = parseInt(prompt("Enter a number :"));

        let status = true;
        for (let i = 2; i < digit; i++) {
            if (digit % i == 0) {
                status = false;
            }
        }
        if (status) {
            document.write("This is a prime number : " + digit);
        } else {
            document.write("This is not a prime number : " + digit);
        }
    </script>
</body>

</html>
