<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function power(base, pw) {
            let num = 1;
            for (let i = 1; i <= pw; i++) {
                num = num * base
            }
            return num;
        }
        document.write(power(2, 6));
    </script>
</body>

</html>
