<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let num1 = parseInt(prompt("Enter first number"));
        let num2 = parseInt(prompt("Enter second number"));

        if (num1 > num2) {
            document.write("Number first is greater : " + num1);

        } else {
            document.write("Number second is greater : " + num2);

        }


    </script>
</body>

</html>
