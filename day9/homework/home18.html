<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function sum() {
            let digit1 = parseInt(prompt("Enter first number."));
            let digit2 = parseInt(prompt("Enter second number."));

            let result = digit1 + digit2;
            document.write("Sum of two numbers : " + result);

        }

        sum();
        document.write("<br>");
        sum();
        document.write("<br>");
        sum();
        document.write("<br>");

    </script>
</body>

</html>
