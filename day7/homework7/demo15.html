<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            background-color: aqua;
            width: 300px;
            height: 300px;
            border: 2px solid black;
             animation: anim 5s linear 2;
            
        }
        body{
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        @keyframes anim{
            
            0%{
                transform: scale(1.2);
            }
            50%{
                transform: scale(1.5);
            }
            90%{
                transform: scale(1.8);
            }
        }

    </style>
</head>
<body>
    <div class="box1"></div>
</body>
</html>
