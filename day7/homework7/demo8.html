<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       *{
        padding: 0;
        margin: 0;
       }
       .image{
        background-image: url(bright-orange-sunset-mws4fux6iklq3uml.jpg);
        width: 100vw;
        height: 100vh;
        background-repeat: no-repeat;
        background-size: cover;
        position: absolute;
       }
       .tint-layer{
        background-color: rgba(0, 0, 0, 0.473);
        width: 100vw;
        height: 100vh;
        position: absolute;
       }
       .textlayer{
        height: 100vh;
        width: 100vw;
        font-size: 80px;
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        color: aliceblue;
       }
    </style>
</head>
<body>
    <div class="image"></div>
    <div class="tint-layer"></div>
    <div class="textlayer">Astonishing Sunset</div>
</body>
</html>
