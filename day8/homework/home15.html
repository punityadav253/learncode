<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let val1 = 40;
        let val2 = 3;
        let result = parseInt(val1 / val2);
        document.write(result);
        let remainder = val1 % val2;
        document.write("<br>");
        document.write(remainder);
    </script>
</body>

</html>
