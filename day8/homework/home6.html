<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let data1= "500";
        document.write("Your value is:"+data1);
        document.write("<br>");
        document.write(typeof data1);
        document.write("<br>");

        let data2= parseInt(data1);
        document.write("Your new value is: "+data2);
        document.write("<br>");
        document.write(typeof data2);
    </script>
      
</body>
</html>
