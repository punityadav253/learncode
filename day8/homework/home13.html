<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let billingAmount = parseInt(prompt("Enter billing amount"));
        let customerPaidAmount = parseInt(prompt("Enter amount paid by customer"));
        if (customerPaidAmount > billingAmount) {
            document.write("Please return extra amount to the customer.");
        } else if (billingAmount > customerPaidAmount) {
            document.write("Collect remaining amount from customer.");
        } else {
            document.write("Thanks for visit.😊");
        }
    </script>
</body>

</html>
