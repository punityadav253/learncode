<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let salary= prompt("Please enter your salary");
        document.write("Your salary is :"+salary);
        document.write("<br>")
        document.write(typeof salary);
        let new_salary= parseInt(salary);
        document.write("<br>");
        document.write(typeof new_salary);
    </script>
</body>
</html>
