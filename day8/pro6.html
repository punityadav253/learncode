<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let val1= parseInt(prompt("Enter value 1"));
        let val2= parseInt(prompt("Enter value 2"));

        if(val1>val2){
            document.write("First value is greater:"+ val1);
        }else{
            document.write("Second value is greater:"+ val2);
        }
    </script>
</body>
</html>
