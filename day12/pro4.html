<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function add() {
            let num1 = parseInt(document.getElementById('firstnum').value);
            let num2 = parseInt(document.getElementById('secondnum').value);
            result = num1 + num2;
            document.getElementById('resultof').value = result;
        }
    </script>
</head>

<body>
    <div>First number: <input type="text" name="" id="firstnum"></div>
    <div>Second number: <input type="text" name="" id="secondnum"></div>
    <div><button onclick="add()">Add</button></div>
    <div>Result: <input type="text" name="" id="resultof"></div>
</body>

</html>
